[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-triage"
version = "0.1.0"
description = "CI test failure triage system"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "pandas",
]

[tool.hatch.build.targets.wheel]
packages = ["ci_triage"]
